<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#D9F2E0 0%,#A8E6C1 60%,#FFF8E7 100%);
  min-height:100vh; color:#4A3728; overflow-x:hidden;
}
.cloud { position:fixed; font-size:44px; opacity:.55; animation:float 7s ease-in-out infinite; pointer-events:none; z-index:0; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
.wrap { max-width:520px; margin:0 auto; padding:18px 16px 40px; position:relative; z-index:1; }
.header { text-align:center; padding:22px 0 6px; }
.mascot { font-size:64px; display:inline-block; animation:bounce 2s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-10px) rotate(4deg)} }
h1 { font-size:30px; color:#38A169; text-shadow:2px 2px 0 #fff; letter-spacing:2px; }
.sub { font-size:14px; color:#8a6d4f; margin-top:6px; }
.card {
  background:#fffdf6; border:3px solid #38A169; border-radius:22px;
  box-shadow:0 5px 0 rgba(0,0,0,.08); padding:20px 18px; margin-top:16px;
}
.big-btn {
  display:block; width:100%; padding:18px; margin-top:14px; border:none; border-radius:18px;
  font-family:inherit; font-size:20px; color:#fff; background:#38A169;
  box-shadow:0 5px 0 #2a7a4e; cursor:pointer; transition:transform .08s;
}
.big-btn:active { transform:translateY(4px); box-shadow:0 1px 0 #2a7a4e; }
.big-btn.alt { background:#FF9F43; box-shadow:0 5px 0 #d97e22; }
.big-btn.ghost { background:#fff; color:#38A169; border:3px solid #38A169; box-shadow:0 4px 0 #2a7a4e; }
.level-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:16px; }
.level-btn {
  background:#fffdf6; border:3px solid #38A169; border-radius:16px; padding:14px 8px;
  font-family:inherit; font-size:17px; color:#4A3728; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.08);
}
.level-btn .stars { font-size:13px; color:#F5A623; margin-top:4px; }
.statusbar { display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:16px; }
.hearts { font-size:20px; letter-spacing:2px; }
.timer-track { height:14px; background:#eee0c8; border-radius:8px; margin-top:8px; overflow:hidden; border:2px solid #38A169; }
.timer-fill { height:100%; background:linear-gradient(90deg,#7ED321,#F5A623,#FF5A5A); border-radius:6px; transition:width .2s linear; }
.qcard { background:#fffdf6; border:3px solid #38A169; border-radius:22px; padding:22px 18px; margin-top:12px; box-shadow:0 5px 0 rgba(0,0,0,.08); }
.qtext { font-size:19px; line-height:1.65; }
.opt {
  display:block; width:100%; text-align:left; padding:15px 16px; margin-top:12px;
  background:#FFF6E3; border:3px solid #E8D5B0; border-radius:16px;
  font-family:inherit; font-size:17px; line-height:1.5; color:#4A3728; cursor:pointer;
  transition:transform .08s;
}
.opt:active { transform:scale(.98); }
.opt .tag { display:inline-block; min-width:26px; height:26px; line-height:23px; text-align:center; background:#38A169; color:#fff; border-radius:50%; margin-right:8px; font-size:14px; }
.opt.correct { background:#DFF6D8; border-color:#7ED321; animation:pulse .5s; }
.opt.wrong { background:#FFE0DC; border-color:#FF5A5A; animation:shake .4s; }
.opt.dim { opacity:.5; }
@keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.03)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.panel { margin-top:16px; border-radius:18px; padding:16px; font-size:15px; line-height:1.7; display:none; }
.panel.show { display:block; animation:slideup .3s; }
@keyframes slideup { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)} }
.panel .verdict { font-size:20px; margin-bottom:8px; }
.panel.exp { background:#EAF4FF; border:3px solid #7FB3E8; }
.panel.fact { background:#FFF3D6; border:3px solid #F5C25A; }
.panel b.tagline { display:block; margin-bottom:4px; }
.star-row { font-size:30px; text-align:center; letter-spacing:4px; margin:10px 0; }
.score-big { font-size:44px; text-align:center; color:#38A169; }
.center { text-align:center; }
.small { font-size:13px; color:#a0855c; text-align:center; margin-top:14px; }
.backlink { display:inline-block; margin-top:16px; color:#38A169; font-size:15px; text-decoration:none; }
.fly-star { position:fixed; font-size:30px; animation:flyup 1s forwards; pointer-events:none; z-index:99; }
@keyframes flyup { to { transform:translateY(-160px) scale(1.6); opacity:0; } }
</style>
</head>

<script>
const DATA = [{"name": "成语典故 25题", "questions": [{"n": 1, "q": "\"三顾茅庐\"现在用来比喻什么？", "opts": ["诚心诚意地邀请有才能的人", "三次路过没进门", "三次失败后放弃", "三次成功后骄傲"], "ans": 0, "exp": "刘备三次到隆中茅庐拜访诸葛亮，请他出山。", "fact": "诸葛亮在《出师表》里自己写了\"三顾臣于草庐之中\"，这是他亲口自述。"}, {"n": 2, "q": "\"草船借箭\"现在用来比喻什么？", "opts": ["借别人的力量达到自己的目的", "偷别人的东西", "借东西不还", "自己动手造"], "ans": 0, "exp": "诸葛亮用草船佯攻，从曹操那里\"借\"来十万支箭。", "fact": "历史上\"草船借箭\"的原型是孙权，不是诸葛亮。"}, {"n": 3, "q": "\"望梅止渴\"和谁有关？", "opts": ["曹操", "刘备", "孙权", "诸葛亮"], "ans": 0, "exp": "曹操行军时士兵口渴，他说前面有梅林，大家想到梅子就流出口水。", "fact": "这个故事出自《世说新语》，不是《三国演义》——《三国演义》只是借用了它。"}, {"n": 4, "q": "\"乐不思蜀\"说的是谁？", "opts": ["刘禅", "刘备", "诸葛亮", "关羽"], "ans": 0, "exp": "蜀汉灭亡后刘禅被带到洛阳，司马昭问他想不想蜀国，他说\"此间乐，不思蜀\"。", "fact": "刘禅小名阿斗，\"扶不起的阿斗\"说的就是他。"}, {"n": 5, "q": "\"单刀赴会\"说的是谁？", "opts": ["关羽", "张飞", "赵云", "黄忠"], "ans": 0, "exp": "关羽只带一口刀、几个随从，去赴东吴鲁肃的宴会。", "fact": "正史里这场会面其实是鲁肃冒着风险邀关羽谈判，双方都只带单刀。"}, {"n": 6, "q": "\"万事俱备，只欠东风\"出自哪场战役？", "opts": ["赤壁之战", "官渡之战", "长坂坡之战", "夷陵之战"], "ans": 0, "exp": "周瑜准备好火攻曹操，但冬天刮西北风，火会烧到自己，只缺一场东风。", "fact": "诸葛亮登台\"借东风\"是《三国演义》虚构的。"}, {"n": 7, "q": "\"身在曹营心在汉\"说的是谁？", "opts": ["关羽", "徐庶", "赵云", "黄忠"], "ans": 0, "exp": "关羽暂时留在曹操营中，心里始终想着兄长刘备，得知消息立刻封金挂印离去。", "fact": "还有一句类似的话说徐庶——\"徐庶进曹营，一言不发\"，两人一个在曹营想着刘备，一个终生不为曹操出一计。"}, {"n": 8, "q": "\"锦囊妙计\"通常和谁有关？", "opts": ["诸葛亮", "曹操", "周瑜", "司马懿"], "ans": 0, "exp": "诸葛亮常把计策写在锦囊里，让部下危急时再拆开。", "fact": "赵云护送刘备去东吴娶亲时，诸葛亮给了他三个锦囊，危急时刻一个一个拆开。"}, {"n": 9, "q": "\"逼上梁山\"出自哪本书？", "opts": ["《水浒传》", "《三国演义》", "《西游记》", "《红楼梦》"], "ans": 0, "exp": "林冲等人被官府逼得走投无路，只好上梁山。", "fact": "林冲是《水浒传》里第一个被逼上梁山的朝廷军官。"}, {"n": 10, "q": "\"官逼民反\"在《水浒传》里最典型的代表是谁？", "opts": ["林冲", "宋江", "武松", "李逵"], "ans": 0, "exp": "林冲本是八十万禁军教头，被高俅一步步害到家破人亡，才终于反抗。", "fact": "林冲的遭遇被公认为\"官逼民反\"最完整的写照。"}, {"n": 11, "q": "\"赴汤蹈火\"在《水浒传》里常用来形容什么？", "opts": ["梁山好汉为兄弟两肋插刀的决心", "高俅的狠毒", "蔡京的贪婪", "童贯的勇猛"], "ans": 0, "exp": "梁山好汉立誓时常说\"赴汤蹈火，在所不辞\"。", "fact": "这句话的意思是开水敢蹚、烈火敢踏，形容不避艰险。"}, {"n": 12, "q": "\"一马当先\"在《水浒传》里常形容什么？", "opts": ["冲锋时跑在最前面", "骑马最快", "只有一匹马", "马受惊了"], "ans": 0, "exp": "这个成语就出自《水浒传》，形容作战时策马冲在最前面。", "fact": "林冲是八十万禁军教头出身，冲锋陷阵常是一马当先。"}, {"n": 13, "q": "\"大刀阔斧\"形容什么样的人？", "opts": ["做事果断、有魄力", "做事拖拉", "胆小怕事", "只会蛮干"], "ans": 0, "exp": "像抡起大刀板斧一样，形容办事果断有气势。", "fact": "梁山好汉里李逵用的是两把板斧，一上阵就抡圆了砍。"}, {"n": 14, "q": "\"火眼金睛\"说的是谁？", "opts": ["孙悟空", "猪八戒", "沙僧", "唐僧"], "ans": 0, "exp": "孙悟空在太上老君的八卦炉里炼了七七四十九天，被烟熏出一双火眼金睛。", "fact": "火眼金睛其实是一种\"眼病\"——所以悟空不怕火，却特别怕烟。"}, {"n": 15, "q": "\"腾云驾雾\"在《西游记》里谁最擅长？", "opts": ["孙悟空", "猪八戒", "沙僧", "唐僧"], "ans": 0, "exp": "孙悟空一个筋斗云就是十万八千里。", "fact": "猪八戒、沙僧也会腾云，但速度慢得多，所以探路报信总是悟空去。"}, {"n": 16, "q": "\"神通广大\"在《西游记》里常形容谁？", "opts": ["孙悟空", "唐僧", "沙僧", "白龙马"], "ans": 0, "exp": "孙悟空会七十二变、筋斗云，金箍棒还能随意变大变小。", "fact": "猪八戒会三十六变——天罡三十六变、地煞七十二变，两人学的不是一个路子。"}, {"n": 17, "q": "\"摇身一变\"出自《西游记》，孙悟空最常变成什么钻妖怪肚子？", "opts": ["小虫", "大树", "石头", "小鸟"], "ans": 0, "exp": "孙悟空常变成小虫飞进妖怪肚子里折腾。", "fact": "他变成小虫钻进铁扇公主肚子里，才逼得她交出芭蕉扇。"}, {"n": 18, "q": "\"半路出家\"在《西游记》里说的是谁？", "opts": ["猪八戒", "孙悟空", "沙僧", "唐僧"], "ans": 0, "exp": "猪八戒原本是天蓬元帅，被贬下凡后在高老庄成亲，半路才皈依佛门。", "fact": "他错投猪胎，所以长着一副猪脸，法名\"猪悟能\"。"}, {"n": 19, "q": "\"腾云驾雾\"的反义状态——唐僧为什么只能骑马？", "opts": ["他是凡人，不会法术", "他喜欢马", "他怕高", "马不让别人骑"], "ans": 0, "exp": "唐僧是凡胎肉体，只能靠白龙马代步。", "fact": "白龙马原是西海龙王三太子，因纵火烧了殿上明珠获罪，被观音点化成马。"}, {"n": 20, "q": "\"无拘无束\"在《西游记》里最贴切的时期是？", "opts": ["孙悟空在花果山当美猴王时", "孙悟空取经路上", "唐僧小时候", "沙僧在流沙河"], "ans": 0, "exp": "悟空在花果山称王时自由自在，不受任何管束。", "fact": "正因为受不了天庭的管束，他才大闹天宫——一个无拘无束，一个规矩森严。"}, {"n": 21, "q": "《西游记》用\"心猿意马\"分别指谁？", "opts": ["孙悟空和白龙马", "唐僧和猪八戒", "沙僧和白龙马", "孙悟空和猪八戒"], "ans": 0, "exp": "书里常用\"心猿\"指孙悟空，\"意马\"指白龙马。", "fact": "\"心猿意马\"这个说法比《西游记》古老得多，原本是用来形容人心思不定的。"}, {"n": 22, "q": "\"花枝招展\"这个成语出自哪本书？", "opts": ["《红楼梦》", "《西游记》", "《水浒传》", "《三国演义》"], "ans": 0, "exp": "《红楼梦》里写平儿\"打扮得花枝招展的来了\"，这是这个成语的出处。", "fact": "现在多用\"花枝招展\"形容女子打扮得十分艳丽。"}, {"n": 23, "q": "\"难舍难分\"用来形容感情深厚，在《红楼梦》里常指谁和谁？", "opts": ["贾宝玉和林黛玉", "贾政和王夫人", "贾母和刘姥姥", "贾琏和王熙凤"], "ans": 0, "exp": "宝玉和黛玉从小一桌吃、一床睡，感情最深。", "fact": "两人是姑表兄妹，黛玉进贾府后和宝玉一起跟着贾母住。"}, {"n": 24, "q": "\"机关算尽太聪明，反误了卿卿性命\"说的是谁？", "opts": ["王熙凤", "林黛玉", "薛宝钗", "贾探春"], "ans": 0, "exp": "这是《红楼梦》里王熙凤的判词，说她聪明反被聪明误。", "fact": "这是曲子《聪明累》里的句子，\"机关算尽\"这个成语就由此流行开来。"}, {"n": 25, "q": "\"假作真时真亦假\"的下一句是什么？", "opts": ["无为有处有还无", "满纸荒唐言", "世事洞明皆学问", "红消香断有谁怜"], "ans": 0, "exp": "全联是\"假作真时真亦假，无为有处有还无\"。", "fact": "这副对联挂在太虚幻境的牌坊上，暗示了《红楼梦》整本书的\"真与假\"。"}]}, {"name": "歇后语与俗语 25题", "questions": [{"n": 26, "q": "\"周瑜打黄盖——一个愿打，一个愿挨\"出自哪场战役？", "opts": ["赤壁之战", "官渡之战", "长坂坡之战", "夷陵之战"], "ans": 0, "exp": "黄盖要诈降曹操，周瑜故意当众痛打他，演一出苦肉计。", "fact": "现在这个歇后语常用来形容双方你情我愿。"}, {"n": 27, "q": "下面哪个场景最适合用\"张飞穿针——大眼瞪小眼\"来形容？", "opts": ["弟弟打碎了花瓶，兄弟俩你看我、我看你，谁也不敢说话", "张飞绣了一朵漂亮的花", "两个人比赛穿针，张飞赢了", "张飞瞪着眼睛吓唬敌人"], "ans": 0, "exp": "这个歇后语形容大家面面相觑、干着急没办法，A的画面最贴切。", "fact": "写作文时用上它，比干巴巴的\"大家都很着急\"生动多了。"}, {"n": 28, "q": "\"刘备借荆州——有借无还\"说的是什么？", "opts": ["刘备借了荆州一直没还", "刘备按时归还", "刘备没借过", "刘备白送了荆州"], "ans": 0, "exp": "赤壁之战后刘备向东吴借荆州立足，后来一直不还。", "fact": "为了讨还荆州，东吴和蜀汉差点翻脸，也为后来关羽失荆州埋下伏笔。"}, {"n": 29, "q": "\"关羽失荆州——骄兵必败\"说明什么道理？", "opts": ["骄傲轻敌一定会失败", "关羽武功不高", "荆州不重要", "关羽运气不好"], "ans": 0, "exp": "关羽骄傲自大，看不起东吴，中了吕蒙、陆逊的计谋。", "fact": "关羽败走麦城，被孙权军擒获杀害，赤兔马和青龙偃月刀都落入了东吴之手。"}, {"n": 30, "q": "\"曹操下江南——来得凶，败得惨\"说的是哪场战役？", "opts": ["赤壁之战", "官渡之战", "长坂坡之战", "夷陵之战"], "ans": 0, "exp": "曹操率大军南下，在赤壁被孙刘联军一把大火烧得大败。", "fact": "曹操号称八十万大军，实际大约二十多万——古人打仗都爱夸大数字吓唬人。"}, {"n": 31, "q": "下面哪个场景最适合用\"张飞吃豆芽——小菜一碟\"来形容？", "opts": ["班里最难的数学题，小明三分钟就解了出来", "张飞今天胃口不好", "妈妈炒了一盘豆芽", "小明连简单的题也做错了"], "ans": 0, "exp": "\"小菜一碟\"用来形容事情轻松简单、毫不费力，A最贴切。", "fact": "这个歇后语是后人编的——豆芽是宋明以后才常见的菜，张飞那会儿还吃不上呢。"}, {"n": 32, "q": "\"猪八戒照镜子——里外不是人\"形容什么？", "opts": ["两边都得罪，两头不讨好", "猪八戒爱照镜子", "猪八戒很丑", "猪八戒很帅"], "ans": 0, "exp": "猪八戒照镜子，镜里镜外都是猪模样，所以说\"里外不是人\"。", "fact": "猪八戒原本是天蓬元帅，因为调戏嫦娥被贬下凡。"}, {"n": 33, "q": "\"孙悟空大闹天宫——慌了神\"形容什么？", "opts": ["把事情闹大了，大家都慌了", "孙悟空很厉害", "天宫很乱", "孙悟空很慌"], "ans": 0, "exp": "孙悟空大闹天宫，天兵天将拿他没办法，玉帝也慌了神。", "fact": "玉帝只好派人去西天请如来佛祖帮忙。"}, {"n": 34, "q": "\"唐僧念经——一本正经\"形容什么？", "opts": ["摆出很严肃正经的样子", "唐僧很会念经", "唐僧脾气大", "唐僧嗓子好"], "ans": 0, "exp": "唐僧念经时端端正正、一丝不苟，所以有这个歇后语。", "fact": "唐僧念的紧箍咒，是观音菩萨教给他的，原文叫\"定心真言\"。"}, {"n": 35, "q": "\"白骨精给唐僧送饭——假心假意\"形容什么？", "opts": ["假装好心，实际没安好心", "白骨精很善良", "唐僧很饿", "白骨精会做饭"], "ans": 0, "exp": "白骨精变成送饭的少女，实际想吃唐僧。", "fact": "白骨精被打死后现出原形，是一堆白骨，脊梁上还刻着\"白骨夫人\"四个字。"}, {"n": 36, "q": "\"孙悟空借芭蕉扇——一物降一物\"说明什么？", "opts": ["再厉害的人也有能克制他的东西", "芭蕉扇最厉害", "孙悟空怕热", "铁扇公主最厉害"], "ans": 0, "exp": "孙悟空神通广大，却奈何不了芭蕉扇一扇八万里。", "fact": "芭蕉扇一扇能灭火，二扇能生风，三扇能下雨。"}, {"n": 37, "q": "\"猪八戒背媳妇——费力不讨好\"形容什么？", "opts": ["出了力气，却没得到好结果", "猪八戒力气大", "猪八戒很勤快", "猪八戒很疼媳妇"], "ans": 0, "exp": "\"撞天婚\"一难里，八戒忙了半天背\"媳妇\"，结果出尽洋相。", "fact": "那次考验里，几个\"媳妇\"其实是菩萨们变的，专试师徒的禅心。"}, {"n": 38, "q": "\"沙僧挑行李——义不容辞\"形容什么？", "opts": ["应该做的事，绝不推辞", "沙僧力气大", "沙僧很老实", "行李很重"], "ans": 0, "exp": "沙僧一路挑担牵马，任劳任怨，从不抱怨。", "fact": "沙僧原来是天庭的卷帘大将，只因失手打碎琉璃盏就被贬下凡，在流沙河吃尽了苦。"}, {"n": 39, "q": "\"李逵骂宋江——过后赔不是\"形容什么？", "opts": ["一时冲动做错事，事后认错", "李逵很勇敢", "宋江很宽容", "李逵很聪明"], "ans": 0, "exp": "李逵误信谣言，以为宋江抢了民女，抡起板斧就骂，查明真相后负荆请罪。", "fact": "这段故事叫\"李逵负荆\"，说明李逵鲁莽但也耿直。"}, {"n": 40, "q": "下面哪个场景最适合用\"武松打虎——一举成名\"来形容？", "opts": ["小华第一次参加全市作文比赛就拿了一等奖，全校都认识她了", "小华每天都很努力", "武松做了阳谷县都头", "小华的名字很好听"], "ans": 0, "exp": "\"一举成名\"指做成一件大事，一下子就出了名，A最贴切。", "fact": "武松打虎前喝了十八碗酒，店家的酒叫\"透瓶香\"，又叫\"出门倒\"。"}, {"n": 41, "q": "\"林冲上梁山——逼出来的\"形容什么？", "opts": ["被逼无奈才去做的事", "林冲想上梁山", "林冲很勇敢", "林冲很聪明"], "ans": 0, "exp": "林冲一忍再忍，直到高俅要烧死他，才雪夜上梁山。", "fact": "林冲上梁山时，寨主王伦心胸狭窄，还逼他下山杀人交\"投名状\"。"}, {"n": 42, "q": "\"鲁智深倒拔垂杨柳——力大无穷\"形容什么？", "opts": ["力气极大", "鲁智深爱种树", "柳树很细", "鲁智深很闲"], "ans": 0, "exp": "鲁智深抱住碗口粗的柳树，连根拔起。", "fact": "古代武将形容力气大常说\"力能扛鼎\"，倒拔垂杨柳更夸张——树根还带着一大坨土。"}, {"n": 43, "q": "\"梁山好汉——不打不相识\"形容什么？", "opts": ["打过一架反而成了朋友", "梁山好汉爱打架", "梁山好汉很团结", "梁山好汉武功高"], "ans": 0, "exp": "不少好汉都是先交手后结交，比如林冲和杨志、李逵和张顺。", "fact": "梁山一百零八将，对应天上的三十六天罡、七十二地煞。"}, {"n": 44, "q": "\"贾宝玉结婚——不是心上人\"形容什么？", "opts": ["得到的不是自己想要的", "贾宝玉不想结婚", "贾宝玉很花心", "婚礼很热闹"], "ans": 0, "exp": "宝玉被骗娶了宝钗，心里念的是黛玉（通行120回本情节）。", "fact": "这场\"调包计\"骗宝玉说娶的是林妹妹，掀起盖头才发现是宝姐姐。"}, {"n": 45, "q": "\"林黛玉葬花——自叹命薄\"形容什么？", "opts": ["感叹自己命运不好", "林黛玉爱花", "林黛玉很勤快", "林黛玉很清闲"], "ans": 0, "exp": "黛玉由落花想到自己孤苦无依，边葬花边吟诗流泪。", "fact": "《葬花吟》里\"一朝春尽红颜老，花落人亡两不知\"，预示了黛玉的结局。"}, {"n": 46, "q": "下面哪个场景最适合用\"刘姥姥进大观园——眼花缭乱\"来形容？", "opts": ["小军第一次进科技馆，新奇玩意儿多得看都看不过来", "小军的眼睛近视了", "大观园里的花开了", "小军在花园里数花"], "ans": 0, "exp": "这个歇后语形容新奇东西太多、看不过来，A最贴切。", "fact": "刘姥姥二进大观园时，把贾府上下逗得前仰后合——作文里写\"第一次进城/参观\"，用这句特别有画面感。"}, {"n": 47, "q": "\"王熙凤管家——大权在握\"形容什么？", "opts": ["掌握着实际权力", "王熙凤很漂亮", "王熙凤很善良", "王熙凤很清闲"], "ans": 0, "exp": "王熙凤是贾府的实际当家人，里里外外几百口人都归她管。", "fact": "她还曾受托协理宁国府办丧事，两边府里的事一把抓。"}, {"n": 48, "q": "\"贾府的大观园——外强中干\"形容什么？", "opts": ["表面风光，内里已经空虚", "大观园很漂亮", "贾府很有钱", "大观园很大"], "ans": 0, "exp": "贾府看着花团锦簇，其实入不敷出，一天不如一天。", "fact": "为了元春省亲建大观园，贾府几乎掏空了家底。"}, {"n": 49, "q": "\"薛宝钗的冷香丸——可遇不可求\"形容什么？", "opts": ["极其难得，很难碰上", "药很好吃", "宝钗很漂亮", "宝钗很聪明"], "ans": 0, "exp": "冷香丸要用四季的花蕊加四时之水配制，巧得不能再巧才能做成。", "fact": "宝钗天生有\"热毒\"，所以要吃\"冷香\"来压——名字里就藏着她冷静的性格。"}, {"n": 50, "q": "\"孙猴子的脸——说变就变\"形容什么？", "opts": ["变化快，反复无常", "孙悟空会七十二变", "猴子脸很花", "孙悟空脾气好"], "ans": 0, "exp": "孙悟空七十二变，脸想变就变，所以用来形容变化快。", "fact": "二郎神和孙悟空斗变化时，你变鱼我变鹰，是书里最精彩的\"变身大战\"。"}]}, {"name": "诗词名句与判词 25题", "questions": [{"n": 51, "q": "《三国演义》开篇词\"滚滚长江东逝水\"的作者是谁？", "opts": ["罗贯中", "杨慎", "苏轼", "辛弃疾"], "ans": 1, "exp": "这首《临江仙》是明代才子杨慎写的，清初毛宗岗父子修订《三国演义》时把它放在了卷首。", "fact": "很多人以为是罗贯中写的——这是最容易答错的地方。"}, {"n": 52, "q": "\"鞠躬尽瘁，死而后已\"是谁说的？", "opts": ["刘备", "诸葛亮", "曹操", "关羽"], "ans": 1, "exp": "出自诸葛亮的《后出师表》，意思是为国事竭尽全力，到死才停止。", "fact": "诸葛亮最后病逝在五丈原军营中，真正做到了这句话。"}, {"n": 53, "q": "\"宁教我负天下人，休教天下人负我\"是谁说的？", "opts": ["曹操", "刘备", "孙权", "董卓"], "ans": 0, "exp": "《三国演义》里曹操误杀吕伯奢一家后说了这句话。", "fact": "正史记载的原话是\"宁我负人，毋人负我\"，小说加了\"天下\"二字，狠毒程度翻倍。"}, {"n": 54, "q": "\"既生瑜，何生亮\"是谁说的？", "opts": ["诸葛亮", "周瑜", "曹操", "刘备"], "ans": 1, "exp": "《三国演义》里周瑜临死前感叹：既然生了我周瑜，为什么还要生个诸葛亮。", "fact": "正史里的周瑜心胸宽广、才华横溢，\"三气周瑜\"纯属虚构。"}, {"n": 55, "q": "\"人中吕布，马中赤兔\"形容什么？", "opts": ["吕布和赤兔马都是各自当中最出色的", "吕布很会骑马", "赤兔马很快", "吕布长得很帅"], "ans": 0, "exp": "吕布是三国第一猛将，赤兔是三国第一名马。", "fact": "吕布死后，赤兔马归了关羽。"}, {"n": 56, "q": "《红楼梦》判词\"可叹停机德，堪怜咏絮才\"分别写的是谁？", "opts": ["薛宝钗、林黛玉", "林黛玉、薛宝钗", "王熙凤、贾探春", "贾元春、贾迎春"], "ans": 0, "exp": "\"停机德\"用乐羊子妻劝夫上进的典故，指贤淑的宝钗；\"咏絮才\"用才女谢道韫咏雪的典故，指诗才出众的黛玉。", "fact": "两人的判词写在同一首里，是金陵十二钗中唯一\"合用\"一首判词的。"}, {"n": 57, "q": "\"机关算尽太聪明，反误了卿卿性命\"出自哪里？", "opts": ["《红楼梦》王熙凤判词", "《三国演义》", "《水浒传》", "《西游记》"], "ans": 0, "exp": "这是《红楼梦》里写王熙凤的曲子《聪明累》。", "fact": "王熙凤判词配的画是一只雌凤站在冰山上——冰山一化，靠山就没了。"}, {"n": 58, "q": "\"假作真时真亦假，无为有处有还无\"这副对联挂在哪里？", "opts": ["太虚幻境牌坊", "大观园正门", "潇湘馆", "怡红院"], "ans": 0, "exp": "宝玉梦游太虚幻境时看到的对联。", "fact": "这副对联在书里出现了两次，是《红楼梦》\"真假\"主题的点题之笔。"}, {"n": 59, "q": "\"满纸荒唐言，一把辛酸泪\"是谁写的？", "opts": ["曹雪芹", "林黛玉", "贾宝玉", "薛宝钗"], "ans": 0, "exp": "这是曹雪芹在《红楼梦》开篇写的自题诗。", "fact": "曹雪芹晚年穷困潦倒，\"举家食粥\"，书没写完就去世了。"}, {"n": 60, "q": "\"世事洞明皆学问，人情练达即文章\"出自哪里？", "opts": ["《红楼梦》", "《三国演义》", "《水浒传》", "《西游记》"], "ans": 0, "exp": "这是《红楼梦》里的一副对联，意思是通晓世事、老练人情都是学问文章。", "fact": "贾宝玉最讨厌这副对联——因为他最反感钻营仕途那一套。"}, {"n": 61, "q": "\"花谢花飞花满天，红消香断有谁怜\"出自哪首诗？", "opts": ["《葬花吟》", "《秋窗风雨夕》", "《桃花行》", "《柳絮词》"], "ans": 0, "exp": "这是林黛玉葬花时吟的《葬花吟》。", "fact": "黛玉一边葬花一边哭，宝玉在远处听了，也哭倒在山坡上。"}, {"n": 62, "q": "《西游记》开篇诗\"混沌未分天地乱\"讲的是什么？", "opts": ["天地初开", "孙悟空出生", "唐僧取经", "大闹天宫"], "ans": 0, "exp": "开篇诗先讲天地开辟、万物生成，然后才引出花果山的仙石。", "fact": "《西游记》第一回先讲天地、再讲石头、再讲石猴，格局非常大。"}, {"n": 63, "q": "\"皇帝轮流做，明年到我家\"是谁说的？", "opts": ["孙悟空", "猪八戒", "沙僧", "唐僧"], "ans": 0, "exp": "孙悟空大闹天宫时对如来佛祖说的。", "fact": "这句话把天不怕地不怕、蔑视权威的劲儿写到了极点。"}, {"n": 64, "q": "\"路见不平一声吼，该出手时就出手\"歌颂的是什么精神？", "opts": ["梁山好汉的侠义精神", "爱唱歌的精神", "好汉爱打架", "嗓门大"], "ans": 0, "exp": "梁山好汉路见不平、拔刀相助。", "fact": "这是电视剧《水浒传》主题曲《好汉歌》的歌词，原词没有出现在小说里。"}, {"n": 65, "q": "\"三十六计，走为上计\"是什么意思？", "opts": ["打不过就先撤退，保存实力最重要", "逃跑很丢人", "好汉从不逃跑", "跑得越快越好"], "ans": 0, "exp": "形势不利时，主动撤退是上策。", "fact": "\"三十六计\"里\"走为上\"排在最后一计——前面三十五计都不管用，就走。"}, {"n": 66, "q": "\"天下大势，分久必合，合久必分\"出自哪里？", "opts": ["《三国演义》", "《水浒传》", "《西游记》", "《红楼梦》"], "ans": 0, "exp": "这是《三国演义》开篇第一句话。", "fact": "这句话概括了从周朝末年到三国归晋几百年的分分合合。"}, {"n": 67, "q": "\"对酒当歌，人生几何\"是谁写的？", "opts": ["曹操", "刘备", "诸葛亮", "曹丕"], "ans": 0, "exp": "出自曹操的《短歌行》，感叹人生短促、要建功立业。", "fact": "曹操、曹丕、曹植父子合称\"三曹\"，是建安文学的核心。"}, {"n": 68, "q": "\"老骥伏枥，志在千里\"是谁写的？", "opts": ["曹操", "刘备", "诸葛亮", "曹丕"], "ans": 0, "exp": "出自曹操的《龟虽寿》，老马伏在马槽边，心里还想着驰骋千里。", "fact": "写这首诗时曹操已经五十多岁，刚北征乌桓归来，仍想着统一天下。"}, {"n": 69, "q": "\"勿以恶小而为之，勿以善小而不为\"是谁说的？", "opts": ["刘备", "曹操", "诸葛亮", "关羽"], "ans": 0, "exp": "刘备临终前在遗诏里告诫儿子刘禅的话。", "fact": "同一份遗诏里还有\"惟贤惟德，能服于人\"——都是做人的大道理。"}, {"n": 70, "q": "\"非淡泊无以明志，非宁静无以致远\"是谁说的？", "opts": ["诸葛亮", "刘备", "曹操", "周瑜"], "ans": 0, "exp": "出自诸葛亮写给儿子的《诫子书》。", "fact": "这篇《诫子书》只有86个字，却是古代家书中的名篇。"}, {"n": 71, "q": "\"不求同年同月同日生，只愿同年同月同日死\"出自什么场合？", "opts": ["桃园结义", "梁山聚义", "赤壁之战", "三顾茅庐"], "ans": 0, "exp": "刘备、关羽、张飞桃园结义时的誓词。", "fact": "这句誓词后来成了结拜兄弟的\"标准台词\"，后世结义都照着念。"}, {"n": 72, "q": "\"一个是阆苑仙葩，一个是美玉无瑕\"写的是谁和谁？", "opts": ["林黛玉和贾宝玉", "薛宝钗和贾宝玉", "王熙凤和贾琏", "贾元春和皇帝"], "ans": 0, "exp": "出自《红楼梦》曲子《枉凝眉》，\"阆苑仙葩\"指黛玉，\"美玉无瑕\"指宝玉。", "fact": "《枉凝眉》后来被谱成电视剧《红楼梦》最著名的插曲。"}, {"n": 73, "q": "\"好风凭借力，送我上青云\"是谁写的？", "opts": ["薛宝钗", "林黛玉", "史湘云", "贾探春"], "ans": 0, "exp": "出自薛宝钗的《柳絮词》。", "fact": "别人写柳絮都是飘零伤感，只有宝钗写出了昂扬奋发，很符合她的性格。"}, {"n": 74, "q": "\"赤日炎炎似火烧，野田禾稻半枯焦\"是谁唱的？", "opts": ["白胜", "武松", "李逵", "时迁"], "ans": 0, "exp": "智取生辰纲时，白日鼠白胜挑着酒上黄泥冈，唱的就是这首歌。", "fact": "这首歌后两句是\"农夫心内如汤煮，公子王孙把扇摇\"——唱出了贫富差别。"}, {"n": 75, "q": "\"血染征袍透甲红，当阳谁敢与争锋\"夸的是谁？", "opts": ["赵云", "关羽", "张飞", "马超"], "ans": 0, "exp": "这是《三国演义》赞赵云长坂坡单骑救主的诗。", "fact": "这首诗的后两句是\"古来冲阵扶危主，只有常山赵子龙\"。"}]}, {"name": "古代文化常识 25题", "questions": [{"n": 76, "q": "《三国演义》中的\"丞相\"是什么官职？", "opts": ["辅佐皇帝的最高文官", "带兵的武将", "地方官", "宫廷侍卫"], "ans": 0, "exp": "丞相是百官之首，诸葛亮就是蜀汉丞相。", "fact": "曹操也做过汉朝丞相，他\"挟天子以令诸侯\"，用皇帝的名义发号施令。"}, {"n": 77, "q": "《三国演义》中的\"大都督\"是什么官职？", "opts": ["最高军事统帅", "文官", "地方官", "宫廷侍卫"], "ans": 0, "exp": "周瑜是东吴大都督，统领全国兵马。", "fact": "陆逊后来也当了大都督，在夷陵之战火烧连营，打败刘备。"}, {"n": 78, "q": "《水浒传》中的\"八十万禁军教头\"是什么官职？", "opts": ["禁军的武术教练", "禁军统领", "皇帝侍卫", "地方武官"], "ans": 0, "exp": "林冲是八十万禁军教头，负责教禁军枪棒武艺。", "fact": "禁军教头不止一个，林冲只是其中之一——名头响，官其实不大。"}, {"n": 79, "q": "《水浒传》中的\"押司\"是什么职务？", "opts": ["县衙里的文书", "县令", "县尉", "捕头"], "ans": 0, "exp": "宋江是郓城县押司，管案卷文书。", "fact": "押司官不大，但宋江仗义疏财，江湖名声比县令还响。"}, {"n": 80, "q": "孙悟空嫌弼马温官小，先给自己封了个什么称号？", "opts": ["齐天大圣", "斗战胜佛", "平天大圣", "混世魔王"], "ans": 0, "exp": "孙悟空反下天庭后自封\"齐天大圣\"，玉帝招安时才正式承认这个称号。", "fact": "牛魔王也给自己封过号，叫\"平天大圣\"，是七大圣里的老大。"}, {"n": 81, "q": "《西游记》中的\"斗战胜佛\"是谁？", "opts": ["孙悟空", "猪八戒", "沙僧", "唐僧"], "ans": 0, "exp": "取经成功后，孙悟空被封为斗战胜佛。", "fact": "唐僧封旃檀功德佛，猪八戒封净坛使者，沙僧封金身罗汉，白龙马封八部天龙。"}, {"n": 82, "q": "《水浒传》中\"及时雨\"是谁的绰号？", "opts": ["宋江", "林冲", "武松", "李逵"], "ans": 0, "exp": "宋江谁有困难都帮，像及时雨一样。", "fact": "宋江还有\"呼保义\"\"孝义黑三郎\"两个绰号，一共三个，好汉中绰号最多的就是他。"}, {"n": 83, "q": "《水浒传》中\"豹子头\"是谁的绰号？", "opts": ["林冲", "武松", "鲁智深", "李逵"], "ans": 0, "exp": "林冲长得豹头环眼，所以叫豹子头。", "fact": "林冲的武器是丈八蛇矛——和张飞的武器同名同姓。"}, {"n": 84, "q": "《三国演义》中\"青龙偃月刀\"是谁的武器？", "opts": ["关羽", "张飞", "赵云", "吕布"], "ans": 0, "exp": "关羽的青龙偃月刀又名\"冷艳锯\"，重八十二斤。", "fact": "关羽死后，这把刀被东吴潘璋所得，后来又被关羽之子关兴夺回。"}, {"n": 85, "q": "《三国演义》中\"丈八蛇矛\"是谁的武器？", "opts": ["张飞", "关羽", "赵云", "吕布"], "ans": 0, "exp": "张飞使用丈八蛇矛。", "fact": "张飞的夫人是夏侯家的姑娘，论辈分还是曹魏大将夏侯渊的侄女——敌我两边是亲戚。"}, {"n": 86, "q": "《西游记》中\"金箍棒\"原本是什么？", "opts": ["大禹治水用的定海神针", "盘古的开天斧", "轩辕剑", "太上老君的拐杖"], "ans": 0, "exp": "金箍棒原是大禹治水时用来测江海深浅的\"定海神针铁\"，留在东海龙宫。", "fact": "它重一万三千五百斤，上书\"如意金箍棒\"五个字。"}, {"n": 87, "q": "《西游记》中\"九齿钉耙\"是谁的武器？", "opts": ["猪八戒", "孙悟空", "沙僧", "唐僧"], "ans": 0, "exp": "九齿钉耙是猪八戒的兵器。", "fact": "这耙子来头不小——太上老君亲手打造，玉帝赐给天蓬元帅的，全名\"上宝沁金钯\"。"}, {"n": 88, "q": "《红楼梦》中\"大观园\"是为什么建的？", "opts": ["贾府为迎接元春省亲而建", "贾宝玉要建", "为林黛玉建的", "为办喜事建的"], "ans": 0, "exp": "元春被封为皇妃，回家省亲，贾府专门修建大观园迎接。", "fact": "元春是贾宝玉的亲姐姐，宝玉的诗文启蒙最初就是姐姐教的。"}, {"n": 89, "q": "《红楼梦》中\"潇湘馆\"是谁的住所？", "opts": ["林黛玉", "薛宝钗", "贾宝玉", "贾探春"], "ans": 0, "exp": "潇湘馆是黛玉的住所，种满竹子。", "fact": "探春还给黛玉起了诗号\"潇湘妃子\"，取自娥皇女英泪洒斑竹的传说。"}, {"n": 90, "q": "《红楼梦》中\"怡红院\"是谁的住所？", "opts": ["贾宝玉", "林黛玉", "薛宝钗", "贾探春"], "ans": 0, "exp": "怡红院是宝玉的住所。", "fact": "宝玉的诗号叫\"怡红公子\"，就是从院子名来的。"}, {"n": 91, "q": "《红楼梦》中\"蘅芜苑\"是谁的住所？", "opts": ["薛宝钗", "林黛玉", "贾宝玉", "贾探春"], "ans": 0, "exp": "蘅芜苑是宝钗的住所。", "fact": "宝钗的诗号叫\"蘅芜君\"，\"蘅芜\"是一种香草，暗合她吃\"冷香丸\"的设定。"}, {"n": 92, "q": "《西游记》中\"花果山\"在哪里？", "opts": ["东胜神洲", "西牛贺洲", "南赡部洲", "北俱芦洲"], "ans": 0, "exp": "孙悟空出生在东胜神洲傲来国的花果山。", "fact": "书里把世界分成四大部洲，取经从南赡部洲出发，去的是西牛贺洲。"}, {"n": 93, "q": "《西游记》中\"火焰山\"的原型在今天哪里？", "opts": ["新疆吐鲁番", "甘肃敦煌", "内蒙古", "西藏"], "ans": 0, "exp": "火焰山在新疆吐鲁番盆地，是中国最热的地方。", "fact": "那里夏季地表温度能超过80度，沙窝里可以烤熟鸡蛋。"}, {"n": 94, "q": "《水浒传》中\"梁山泊\"在今天哪个省？", "opts": ["山东", "河南", "河北", "江苏"], "ans": 0, "exp": "梁山泊位于今天的山东省。", "fact": "古梁山泊的水面如今大多淤积，遗存的水域叫东平湖，是山东第二大淡水湖。"}, {"n": 95, "q": "《三国演义》中\"赤壁\"在今天哪个省？", "opts": ["湖北", "湖南", "江西", "安徽"], "ans": 0, "exp": "赤壁在今天的湖北省赤壁市（原名蒲圻）。", "fact": "赤壁之战是中国历史上以少胜多的经典战例，孙刘联军约五万，大败曹操二十多万大军。"}, {"n": 96, "q": "《三国演义》中\"华容道\"在今天哪个省？", "opts": ["湖北", "湖南", "江西", "安徽"], "ans": 0, "exp": "华容道在今天湖北省监利一带。", "fact": "关羽在华容道放走曹操后，回营向诸葛亮请罪，按军令状当斩，刘备求情才免。"}, {"n": 97, "q": "唐僧取经的出发地\"长安\"，是今天哪座城市？", "opts": ["西安", "洛阳", "开封", "南京"], "ans": 0, "exp": "长安就是今天的陕西西安，唐朝的首都。", "fact": "历史上真实的玄奘出发时没有得到官方批准，是悄悄混出关的——相当大胆。"}, {"n": 98, "q": "《红楼梦》中\"金陵\"是今天哪座城市？", "opts": ["南京", "北京", "西安", "洛阳"], "ans": 0, "exp": "金陵是南京的古称。", "fact": "《红楼梦》又叫《金陵十二钗》，\"十二钗\"指书里最重要的十二位女子。"}, {"n": 99, "q": "《水浒传》中\"东京\"是今天哪座城市？", "opts": ["开封", "北京", "西安", "洛阳"], "ans": 0, "exp": "北宋的都城\"东京\"就是今天的河南开封。", "fact": "林冲被发配沧州、杨志卖刀，都是从东京城发生的故事。"}, {"n": 100, "q": "《三国演义》中曹操\"挟天子以令诸侯\"，把汉献帝迁到了哪里？", "opts": ["许昌", "洛阳", "长安", "邺城"], "ans": 0, "exp": "曹操把汉献帝迎到许昌（当时叫许都），从此用皇帝名义号令天下。", "fact": "许昌在今天的河南省，至今还有\"曹魏故都\"的称号。"}]}];
const STORE_KEY = "sdmz_zhong";
const ALL = [];
DATA.forEach(s => s.questions.forEach(q => ALL.push(q)));

let mode = "level", levelIdx = 0, qIdx = 0, score = 0, lives = 3, timeLeft = 40, timerId = null, pool = [];

function $(id){ return document.getElementById(id); }
function show(id){ ["screen-home","screen-levels","screen-quiz","screen-result"].forEach(s => $(s).style.display = s===id?"block":"none"); window.scrollTo(0,0); }
function goHome(){ clearInterval(timerId); show("screen-home"); }
function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||{} }catch(e){ return {} } }
function saveStore(o){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(o)) }catch(e){} }

/* ---------- 闯关 ---------- */
function showLevels(){
  const st = loadStore(); const g = $("levelGrid"); g.innerHTML = "";
  for(let i=0;i<10;i++){
    const stars = st["lv"+i]||0;
    const b = document.createElement("button");
    b.className="level-btn";
    b.innerHTML = "第"+(i+1)+"关<br><span class='stars'>"+"⭐".repeat(stars)+"☆".repeat(10-stars).slice(0,10-stars>0?10-stars:0)+"</span>";
    b.onclick = ()=>startLevel(i);
    g.appendChild(b);
  }
  show("screen-levels");
}
function startLevel(i){
  mode="level"; levelIdx=i; qIdx=0; score=0;
  pool = ALL.slice(i*10, i*10+10);
  $("timerTrack").style.display="none";
  renderQ(); show("screen-quiz");
}
/* ---------- 极限挑战 ---------- */
function startChallenge(){
  mode="challenge"; qIdx=0; score=0; lives=3; timeLeft=40;
  pool = ALL.slice().sort(()=>Math.random()-.5);
  $("timerTrack").style.display="block";
  renderQ(); show("screen-quiz");
  clearInterval(timerId);
  timerId = setInterval(()=>{
    timeLeft = Math.max(0, timeLeft - 0.2);
    $("timerFill").style.width = (timeLeft/40*100)+"%";
    $("statusLeft").textContent = "⏱ "+Math.ceil(timeLeft)+"秒";
    if(timeLeft<=0){ endChallenge(); }
  },200);
}
/* ---------- 出题 ---------- */
function renderQ(){
  const q = pool[qIdx % pool.length];
  if(mode==="level"){
    $("statusLeft").textContent = "第"+(levelIdx+1)+"关 · 第"+(qIdx+1)+"/10题";
    $("statusRight").textContent = "⭐ "+score;
  }else{
    $("statusLeft").textContent = "⏱ "+Math.ceil(timeLeft)+"秒";
    $("statusRight").innerHTML = "<span class='hearts'>"+"❤️".repeat(lives)+"</span> ⭐"+score;
  }
  $("qText").textContent = q.q;
  const box = $("opts"); box.innerHTML="";
  const letters=["A","B","C","D"];
  q.opts.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML="<span class='tag'>"+letters[i]+"</span>"+o;
    b.onclick=()=>answer(i,b,q);
    box.appendChild(b);
  });
  $("expPanel").className="panel exp"; $("factPanel").className="panel fact";
  $("nextBtn").style.display="none";
}
function answer(i, btn, q){
  const opts = document.querySelectorAll(".opt");
  opts.forEach(o=>o.style.pointerEvents="none");
  const ok = i===q.ans;
  opts[q.ans].classList.add("correct");
  if(ok){
    score++;
    const s=document.createElement("div"); s.className="fly-star"; s.textContent="⭐";
    s.style.left="50%"; s.style.top="40%"; document.body.appendChild(s);
    setTimeout(()=>s.remove(),1000);
    opts.forEach((o,idx)=>{ if(idx!==q.ans) o.classList.add("dim"); });
  }else{
    btn.classList.add("wrong");
    if(mode==="challenge"){ lives--; }
  }
  if(mode==="challenge"){ $("statusRight").innerHTML="<span class='hearts'>"+"❤️".repeat(lives)+"</span> ⭐"+score; }
  $("expPanel").innerHTML="<div class='verdict'>"+(ok?"🎉 答对啦！+1颗星":"💪 别灰心！正确答案是 "+"ABCD"[q.ans])+"</div><b class='tagline'>📖 为什么？</b>"+q.exp;
  $("factPanel").innerHTML="<b class='tagline'>💡 冷知识</b>"+q.fact;
  $("expPanel").classList.add("show"); $("factPanel").classList.add("show");
  if(mode==="level"){
    $("nextBtn").style.display="block";
    $("nextBtn").textContent = qIdx===9 ? "看看本关成绩 →" : "下一题 →";
  }else{
    if(lives<=0){ setTimeout(endChallenge, 1600); }
    else setTimeout(()=>{ qIdx++; renderQ(); }, 1600);
  }
}
function nextQuestion(){
  if(mode!=="level") return;
  qIdx++;
  if(qIdx>=10){ endLevel(); } else { renderQ(); }
}
function endLevel(){
  const st = loadStore();
  st["lv"+levelIdx] = Math.max(st["lv"+levelIdx]||0, score);
  saveStore(st);
  $("resultTitle").textContent = score>=8 ? "太棒了！" : score>=5 ? "不错哦！" : "继续加油！";
  $("resultStars").textContent = "⭐".repeat(score)+"☆".repeat(10-score);
  $("resultScore").textContent = score*10+" 分";
  $("resultNote").textContent = "第"+(levelIdx+1)+"关：答对 "+score+"/10 题";
  $("resultBtn1").textContent = levelIdx<9 ? "挑战下一关 →" : "再玩一次";
  show("screen-result");
}
function resultAction1(){
  if(mode==="level"){ startLevel(levelIdx<9?levelIdx+1:levelIdx); }
  else{ startChallenge(); }
}
function endChallenge(){
  clearInterval(timerId);
  const st = loadStore();
  const best = st["best"]||0;
  if(score>best){ st["best"]=score; saveStore(st); }
  $("resultTitle").textContent = score>best ? "新纪录！" : "挑战结束！";
  $("resultStars").textContent = "⭐".repeat(Math.min(score,20));
  $("resultScore").textContent = score*10+" 分";
  $("resultNote").textContent = "答对 "+score+" 题 · 历史最佳 "+Math.max(best,score)*10+" 分";
  $("resultBtn1").textContent = "再来一次 ⚡";
  show("screen-result");
}
</script>
</body>
</html>
